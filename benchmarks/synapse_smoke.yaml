      "difficulty": "medium",
      "expected_traits": ["sequenced", "realistic", "risk-aware"],
      "max_output_tokens": 900,
      "prompt": "Create a six-week release plan for a small team shipping a local desktop AI tool. Include milestones, risks, rollback criteria, and what to defer."
