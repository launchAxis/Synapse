      "category": "analysis_tradeoffs",
      "difficulty": "medium",
      "expected_traits": ["tradeoffs", "recommendation", "assumptions"],
      "max_output_tokens": 900,
      "prompt": "Choose between a best-single-model design, a naive ensemble, and a structured multi-agent orchestration system for a local AI app. Users tolerate up to 45 seconds for deep mode. Provide a comparison matrix, recommendation, and strongest counterargument."
    },
    {
      "id": "D01",
