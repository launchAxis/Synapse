      "category": "coding_architecture",
      "difficulty": "medium",
      "expected_traits": ["module boundaries", "migration plan", "tests"],
      "max_output_tokens": 900,
      "prompt": "A benchmark script is now a 900-line monolith mixing prompt loading, inference, judging, CSV writing, report generation, and CLI parsing. Propose a refactor plan with module boundaries, migration order, and first tests."
    },
    {
      "id": "R01",
      "title": "Conflicting benchmark constraints",
      "category": "robustness_ambiguity",
      "difficulty": "hard",
      "expected_traits": ["prioritization", "tradeoffs", "clear unresolved items"],
      "max_output_tokens": 950,
      "prompt": "Produce a benchmark recommendation memo under these constraints: reproducible, realistic, cheap enough for weekly runs, catches regressions early, does not depend too heavily on one judge model, and is understandable to non-research engineers."
