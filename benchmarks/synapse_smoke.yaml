      "title": "Audit flawed benchmark proposal",
      "category": "critique_revision",
      "difficulty": "hard",
      "expected_traits": ["critical", "constructive", "methodological"],
      "max_output_tokens": 1000,
      "prompt": "Audit this benchmark proposal and rewrite it into something credible: We test 4 systems on 12 prompts selected from examples where our system looks smart. One LLM judge picks a winner. We do not randomize answer order. We report average wins and skip human review."
